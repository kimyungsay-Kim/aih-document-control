<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex, nofollow"><meta name="referrer" content="no-referrer">
<title>AIH Document Control</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: gradient project band → sticky tab/filter bar → summary first, then lists of document rows (grid on desktop, stacked cards on phone) */
:root{
  --bg:#F4F7F9; --surface:#FFFFFF; --ink:#15313D; --muted:#5D7480; --line:#DCE5EA; --soft:#EEF3F6;
  --accent:#0C7A84; --accent-ink:#075A62; --accent-soft:#DDF2F2; --safety:#E9822A;
  --band:linear-gradient(118deg,#D9F2EE 0%,#E3EDFB 48%,#FCEFDD 100%);
  --ok:#17905A; --ok-bg:#E2F5EA; --note:#B07A00; --note-bg:#FFF2CF; --fail:#CF3B32; --fail-bg:#FCE6E3;
  --wait:#2A63C6; --wait-bg:#E4EDFC; --ans:#6650C8; --ans-bg:#EDE9FB; --idle:#677B85; --idle-bg:#EDF1F3;
  --f-display:"Anuphan","IBM Plex Sans Thai","Leelawadee UI",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Thai","Leelawadee UI",Tahoma,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",Consolas,"Courier New",monospace;
  --r:12px; --shadow:0 1px 2px rgba(21,49,61,.06),0 6px 20px -12px rgba(21,49,61,.18);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:var(--accent-ink)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.86em;letter-spacing:-.01em}

/* band */
.band{background:var(--band);border-bottom:1px solid var(--line)}
.band .wrap{padding-block:22px 18px;display:grid;gap:14px}
.brand-row{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font:600 12px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);display:flex;gap:8px;align-items:center}
.eyebrow i{width:18px;height:3px;border-radius:2px;background:var(--safety);display:inline-block}
h1{font:700 clamp(24px,4.2vw,34px)/1.15 var(--f-display);margin:6px 0 0;text-wrap:balance;letter-spacing:-.01em}
.file-meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.file-meta b{color:var(--ink);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;box-shadow:0 0 0 3px var(--ok-bg)}
.dot.stale{background:var(--note);box-shadow:0 0 0 3px var(--note-bg)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink)}
.btn svg{width:16px;height:16px;flex:none}
.search{position:relative}
.search input{width:100%;border:1px solid var(--line);background:rgba(255,255,255,.9);border-radius:12px;padding:12px 14px 12px 42px;font-size:15px;box-shadow:var(--shadow)}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;left:14px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--muted)}

.linkbtn{border:0;background:none;padding:0;font:600 13px var(--f-body);color:var(--accent-ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.sync{font-size:12.5px;color:var(--wait);font-weight:600}
.sync.warn{color:var(--fail)}
.linkcfg{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:10px;box-shadow:var(--shadow)}
.linkcfg label{display:grid;gap:2px}
.linkcfg label span{font-size:12.5px;color:var(--muted)}
.linkcfg input{width:100%;border:2px solid var(--accent);border-radius:10px;padding:10px 12px;font:13px var(--f-mono);background:var(--surface)}
.linkcfg-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.start-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* sticky bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding-block:8px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:8px 12px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tab:hover{background:var(--soft);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent-ink)}
.tab .count{font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--muted)}
.tab[aria-selected="true"] .count{border-color:transparent}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip:hover{border-color:var(--accent);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

main .wrap{padding-block:22px 60px;display:grid;gap:22px;grid-template-columns:minmax(0,1fr)}
h2{font:600 19px/1.3 var(--f-display);margin:0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h2 small{font:400 13px var(--f-body);color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.panel-h{padding:16px 18px 12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:4px;box-shadow:var(--shadow);text-align:left;cursor:pointer;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--k,var(--accent))}
.kpi:hover{border-color:var(--k,var(--accent))}
.kpi .lbl{font-size:13px;color:var(--muted);font-weight:500}
.kpi .val{font:700 30px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px;color:var(--muted)}
@media (max-width:900px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi .val{font-size:26px}}

/* category table */
.cats{display:grid}
.cat{display:grid;grid-template-columns:minmax(150px,220px) 1fr 64px;gap:14px;align-items:center;padding:10px 18px;border-top:1px solid var(--soft);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.cat:hover{background:#F8FBFC}
.cat .nm{font-weight:600;font-size:14px}
.cat .nm small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.stack{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--soft);gap:2px}
.stack span{display:block;height:100%;min-width:3px}
.cat .tot{font:600 15px var(--f-display);text-align:right;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.cat .mini{display:flex;gap:10px;font-size:12px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
@media (max-width:640px){.cat{grid-template-columns:1fr 48px;gap:6px 10px}.cat .barwrap{grid-column:1/-1;grid-row:2}}

.two{display:grid;grid-template-columns:1.1fr .9fr;gap:22px}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.list-plain{list-style:none;margin:0;padding:0 18px 14px}
.list-plain li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--soft);font-size:14px}
.list-plain li:first-child{border-top:0}
.list-plain .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.check{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 18px;border-top:1px solid var(--soft);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.check:hover{background:#FBFCFD}
.check .ico{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-weight:700}
.check b{font:700 18px var(--f-display)}
.check p{margin:0;font-size:13px;color:var(--muted)}
.check strong{display:block;font-size:14px}

/* status pills */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;white-space:nowrap;background:var(--pbg);color:var(--pc)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-ok{--pc:var(--ok);--pbg:var(--ok-bg)} .s-note{--pc:var(--note);--pbg:var(--note-bg)} .s-fail{--pc:var(--fail);--pbg:var(--fail-bg)}
.s-waiting{--pc:var(--wait);--pbg:var(--wait-bg)} .s-answered{--pc:var(--ans);--pbg:var(--ans-bg)}
.s-sent,.s-none,.s-other,.s-in{--pc:var(--idle);--pbg:var(--idle-bg)}
.age{font:600 12px var(--f-body);padding:2px 8px;border-radius:6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.age.a1{background:var(--ok-bg);color:var(--ok)} .age.a2{background:var(--note-bg);color:var(--note)} .age.a3{background:#FFE6D2;color:#B85A12} .age.a4{background:var(--fail-bg);color:var(--fail)}

/* document-type picker */
.picker{background:linear-gradient(120deg,#E3F5F3 0%,#E8F0FC 60%,#FDF3E4 100%);border:2px solid #9FD3D3;border-radius:16px;padding:14px 16px;display:grid;gap:12px;box-shadow:var(--shadow)}
.picker-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center}
.picker-lbl{display:flex;gap:10px;align-items:center;cursor:pointer}
.picker-lbl b{display:block;font:700 16px/1.2 var(--f-display)}
.picker-lbl small{display:block;font-size:12px;color:var(--muted)}
.picker-ic{width:38px;height:38px;border-radius:11px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.picker-ic svg{width:20px;height:20px}
.select-wrap{position:relative;min-width:0}
.picker select{min-width:0}
.select-wrap::after{content:"";position:absolute;right:16px;top:50%;width:10px;height:10px;border-right:2.5px solid var(--accent-ink);border-bottom:2.5px solid var(--accent-ink);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.picker select{appearance:none;-webkit-appearance:none;width:100%;height:50px;border:2px solid var(--accent);border-radius:12px;background:var(--surface);padding:0 44px 0 16px;font:600 16px var(--f-body);color:var(--ink);cursor:pointer;box-shadow:0 2px 0 rgba(12,122,132,.15)}
.picker select:hover{background:#F7FDFD}
.picker select:focus{outline:none;box-shadow:0 0 0 4px rgba(12,122,132,.2)}
.picker-count{display:grid;justify-items:end;line-height:1.1}
.picker-count b{font:700 24px var(--f-display);color:var(--accent-ink)}
.picker-count span{font-size:12px;color:var(--muted)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:620px){.quick{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}}
.qchip{border:1px solid rgba(12,122,132,.25);background:rgba(255,255,255,.75);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--accent-ink);cursor:pointer;white-space:nowrap}
.qchip:hover{background:#fff;border-color:var(--accent)}
.qchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
@media (max-width:620px){.picker{padding:12px}.picker-row{grid-template-columns:minmax(0,1fr) auto}.select-wrap{grid-column:1/-1;grid-row:2}.picker-lbl small{display:none}}

.disc-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row-lbl{font:600 13px var(--f-body);color:var(--muted);letter-spacing:.04em}
.chip.disc{padding:6px 16px;font-size:14px}
@media (max-width:620px){.disc-row .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;max-width:100%}.disc-row .chips::-webkit-scrollbar{display:none}.disc-row{flex-wrap:nowrap}}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar select{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);max-width:100%}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;user-select:none}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.sort-group{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
.sort-opt{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 12px 5px 9px;font-weight:600;font-size:13.5px}
.sort-opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.result-info{font-size:13px;color:var(--muted)}
.notice{background:var(--accent-soft);color:var(--accent-ink);border-radius:10px;padding:10px 14px;font-size:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.notice button{border:0;background:none;color:inherit;font-weight:600;text-decoration:underline;cursor:pointer}

/* doc rows */
.docs{display:grid;gap:10px}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) 230px 250px;gap:8px 18px;box-shadow:var(--shadow);border-left:4px solid var(--pc,var(--line))}
.doc-main{min-width:0;display:grid;gap:4px}
.doc-top{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.tag{font-size:11.5px;font-weight:600;border-radius:6px;padding:1px 7px;background:var(--soft);color:var(--muted);white-space:nowrap}
.code{font-family:var(--f-mono);font-weight:600;font-size:13px;color:var(--ink);word-break:break-all}
.desc{margin:0;font-size:14.5px;line-height:1.5;overflow-wrap:anywhere}
.meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 12px}
.meta em{font-style:normal;color:var(--ink)}
.remark{font-size:12.5px;color:#7A5A12;background:#FFF8E6;border-radius:6px;padding:3px 8px;justify-self:start;overflow-wrap:anywhere}
.doc-state{display:grid;gap:6px;align-content:start;justify-items:start}
.dates{font-size:12.5px;color:var(--muted);display:grid;gap:1px}
.dates b{color:var(--ink);font-weight:600}
.doc-links{display:grid;gap:6px;align-content:start}
.lk{display:flex;align-items:center;gap:8px;text-decoration:none;border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:13px;font-weight:600;color:var(--ink);background:var(--surface);min-width:0}
.lk:hover{border-color:var(--accent);background:#F7FCFC}
.lk .lk-ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font:700 10px var(--f-body);color:#fff;flex:none}
.lk.sa .lk-ic{background:linear-gradient(135deg,#F39A3D,#E2602B)}
.lk.od .lk-ic{background:linear-gradient(135deg,#2A8CE0,#1460C2)}
.lk span.t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lk small{margin-left:auto;font-weight:500;color:var(--muted);font-family:var(--f-mono);font-size:11.5px;white-space:nowrap}
.lk.off{opacity:.55;pointer-events:none;border-style:dashed;font-weight:500;color:var(--muted)}
.revs{grid-column:1/-1;min-width:0}
.revs summary{cursor:pointer;font-size:13px;color:var(--accent-ink);font-weight:600;list-style:none;display:inline-flex;gap:6px;align-items:center}
.revs summary::-webkit-details-marker{display:none}
.revs summary::before{content:"▸";transition:transform .15s}
.revs[open] summary::before{transform:rotate(90deg)}
.rev-tbl{margin-top:8px;overflow-x:auto;border:1px solid var(--soft);border-radius:10px}
.rev-tbl table{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
.rev-tbl th{background:var(--soft);font-weight:600;text-align:left;padding:7px 10px;color:var(--muted);font-size:12px}
.rev-tbl td{padding:7px 10px;border-top:1px solid var(--soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.rev-tbl a{font-weight:600}
@media (max-width:980px){.doc{grid-template-columns:minmax(0,1fr) 220px}.doc-links{grid-column:1/-1;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}}
@media (max-width:620px){.doc{grid-template-columns:minmax(0,1fr);padding:13px 14px}.doc-state{grid-auto-flow:column;justify-content:start;align-items:center;flex-wrap:wrap}.doc-links{grid-template-columns:1fr 1fr}.lk span.t{display:none}.lk small{margin-left:0;font-size:12px;color:var(--ink);font-weight:600}.lk.off span.t{display:inline}
  .bar .wrap{gap:6px}.bar .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;max-width:100%;padding-bottom:2px}.bar .chips::-webkit-scrollbar{display:none}.chip{white-space:nowrap}}
@media (max-width:380px){.doc-links{grid-template-columns:1fr}}
.more{justify-self:center}
.empty-list{padding:28px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}

/* buckets */
.buckets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.bucket{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;text-align:left;cursor:pointer;display:grid;gap:2px;box-shadow:var(--shadow)}
.bucket[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.bucket .val{font:700 24px var(--f-display);font-variant-numeric:tabular-nums}
.bucket .lbl{font-size:13px;color:var(--muted)}
@media (max-width:620px){.buckets{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* start screen */
.start{display:grid;grid-template-columns:1.1fr .9fr;gap:22px;align-items:start}
@media (max-width:860px){.start{grid-template-columns:1fr}}
.drop{background:var(--surface);border:2px dashed #B9D6DA;border-radius:18px;padding:34px 26px;display:grid;gap:14px;justify-items:start;box-shadow:var(--shadow)}
.drop.over{border-color:var(--accent);background:#F4FBFB}
.drop h2{font-size:22px}
.drop p{margin:0;color:var(--muted);max-width:60ch}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:12px;counter-reset:s}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;font-size:14px}
.steps li::before{counter-increment:s;content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-weight:700}
.steps b{display:block}
.steps span{color:var(--muted)}

/* overlay */
.overlay{position:fixed;inset:0;background:rgba(244,247,249,.82);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:50;padding:16px}
.loader{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px;width:min(360px,100%);box-shadow:var(--shadow);display:grid;gap:12px}
.loader .track{height:8px;border-radius:999px;background:var(--soft);overflow:hidden}
.loader .fill{height:100%;width:0;background:linear-gradient(90deg,#3DB8B0,#4D8BE8,#F0A04B);transition:width .2s}
.loader p{margin:0;font-size:13px;color:var(--muted)}

<script>
/* ===== DCS parser: reads Document Control Status .xlsx with no external library ===== */
const DCS = (() => {
  const td = new TextDecoder('utf-8');

  /* ---------- ZIP ---------- */
  function readZip(buf) {
    const u8 = new Uint8Array(buf), dv = new DataView(buf);
    let eocd = -1;
    for (let i = u8.length - 22; i >= Math.max(0, u8.length - 70000); i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error('ไฟล์นี้ไม่ใช่ไฟล์ Excel (.xlsx)');
    const n = dv.getUint16(eocd + 10, true);
    let p = dv.getUint32(eocd + 16, true);
    const files = new Map();
    for (let k = 0; k < n; k++) {
      if (dv.getUint32(p, true) !== 0x02014b50) break;
      const method = dv.getUint16(p + 10, true);
      const csize = dv.getUint32(p + 20, true);
      const nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
      const lho = dv.getUint32(p + 42, true);
      const name = td.decode(u8.subarray(p + 46, p + 46 + nlen));
      files.set(name, { method, csize, lho });
      p += 46 + nlen + xlen + clen;
    }
    async function text(name) {
      const f = files.get(name);
      if (!f) return null;
      const ln = dv.getUint16(f.lho + 26, true), lx = dv.getUint16(f.lho + 28, true);
      const start = f.lho + 30 + ln + lx;
      const raw = u8.subarray(start, start + f.csize);
      if (f.method === 0) return td.decode(raw);
      const ds = new DecompressionStream('deflate-raw');
      const out = await new Response(new Blob([raw]).stream().pipeThrough(ds)).arrayBuffer();
      return td.decode(out);
    }
    return { files, text };
  }

  /* ---------- XML helpers ---------- */
  const ENT = { amp: '&', lt: '<', gt: '>', quot: '"', apos: "'" };
  function unesc(s) {
    if (s == null) return '';
    return s.replace(/&(#x[0-9a-f]+|#\d+|\w+);/gi, (m, e) => {
      if (e[0] === '#') return String.fromCodePoint(e[1] === 'x' || e[1] === 'X' ? parseInt(e.slice(2), 16) : parseInt(e.slice(1), 10));
      return ENT[e] ?? m;
    }).replace(/_x([0-9A-F]{4})_/g, (m, h) => String.fromCharCode(parseInt(h, 16)));
  }
  function attr(s, name) {
    const m = new RegExp('(?:^|\\s)' + name + '="([^"]*)"').exec(s);
    return m ? unesc(m[1]) : null;
  }
  function textRuns(x) {
    x = x.replace(/<rPh\b[\s\S]*?<\/rPh>/g, '');
    let out = '', m; const re = /<t(?:\s[^>]*)?>([\s\S]*?)<\/t>|<t\s*\/>/g;
    while ((m = re.exec(x))) out += m[1] ? unesc(m[1]) : '';
    return out;
  }
  function colIdx(letters) { let n = 0; for (const ch of letters) n = n * 26 + ch.charCodeAt(0) - 64; return n - 1; }
  function splitRef(ref) { const m = /^\$?([A-Z]+)\$?(\d+)$/.exec(ref); return m ? [colIdx(m[1]), +m[2]] : null; }

  /* ---------- Workbook ---------- */
  const DATE_IDS = new Set([14, 15, 16, 17, 18, 19, 20, 21, 22, 27, 30, 36, 45, 46, 47, 50, 57]);
  function relsMap(xml, base) {
    const map = {}; if (!xml) return map;
    const re = /<Relationship\b([^>]*)\/?>/g; let m;
    while ((m = re.exec(xml))) {
      const id = attr(m[1], 'Id'), tg = attr(m[1], 'Target'), mode = attr(m[1], 'TargetMode');
      let path = tg;
      if (mode !== 'External' && base != null) {
        if (tg.startsWith('/')) path = tg.slice(1);
        else { const parts = (base + tg).split('/'); const st = []; for (const s of parts) { if (s === '..') st.pop(); else if (s !== '.') st.push(s); } path = st.join('/'); }
      }
      map[id] = { target: path, external: mode === 'External' };
    }
    return map;
  }

  async function openWorkbook(buf) {
    const z = readZip(buf);
    const wbXml = await z.text('xl/workbook.xml');
    if (!wbXml) throw new Error('ไม่พบข้อมูลสมุดงานในไฟล์');
    const wbRels = relsMap(await z.text('xl/_rels/workbook.xml.rels'), 'xl/');
    const sheets = []; const re = /<sheet\b([^>]*)\/?>/g; let m;
    while ((m = re.exec(wbXml))) {
      const rid = attr(m[1], 'r:id') || attr(m[1], 'id');
      sheets.push({ name: attr(m[1], 'name'), state: attr(m[1], 'state') || 'visible', path: wbRels[rid]?.target });
    }
    const sst = [];
    const sx = await z.text('xl/sharedStrings.xml');
    if (sx) { const r2 = /<si>([\s\S]*?)<\/si>|<si\/>/g; while ((m = r2.exec(sx))) sst.push(m[1] ? textRuns(m[1]) : ''); }
    const dateStyle = [];
    const st = await z.text('xl/styles.xml');
    if (st) {
      const custom = {}; const r3 = /<numFmt\b([^>]*)\/?>/g;
      while ((m = r3.exec(st))) custom[+attr(m[1], 'numFmtId')] = attr(m[1], 'formatCode') || '';
      const xfs = /<cellXfs\b[^>]*>([\s\S]*?)<\/cellXfs>/.exec(st);
      if (xfs) {
        const r4 = /<xf\b([^>]*?)(?:\/>|>)/g;
        while ((m = r4.exec(xfs[1]))) {
          const id = +(attr(m[1], 'numFmtId') || 0);
          let isD = DATE_IDS.has(id);
          if (!isD && custom[id] != null) { const f = custom[id].replace(/"[^"]*"|\[[^\]]*\]|\\./g, ''); isD = /[dmy]/i.test(f) && !/^[hms:.\s0#,]*$/i.test(f); }
          dateStyle.push(isD);
        }
      }
    }

    async function readSheet(sh, maxCol = 64) {
      const xml = await z.text(sh.path);
      if (!xml) return null;
      const dir = sh.path.replace(/[^/]+$/, '');
      const rels = relsMap(await z.text(dir + '_rels/' + sh.path.slice(dir.length) + '.rels'), dir);
      const rows = new Map(); let maxRow = 0;
      const dataStart = xml.indexOf('<sheetData'), dataEnd = xml.indexOf('</sheetData>');
      const body = dataStart >= 0 && dataEnd > dataStart ? xml.slice(dataStart, dataEnd) : '';
      const re = /<c r="([A-Z]+)(\d+)"([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g; let mm;
      while ((mm = re.exec(body))) {
        const c = colIdx(mm[1]); if (c >= maxCol) continue;
        const inner = mm[4]; if (!inner) continue;
        const r = +mm[2], a = mm[3];
        const t = attr(a, 't'), s = +(attr(a, 's') || 0);
        let v = null, isDate = false;
        if (t === 'inlineStr') { const im = /<is>([\s\S]*?)<\/is>/.exec(inner); v = im ? textRuns(im[1]) : ''; }
        else {
          const vm = /<v>([\s\S]*?)<\/v>/.exec(inner); if (!vm) continue;
          const raw = vm[1];
          if (t === 's') v = sst[+raw] ?? '';
          else if (t === 'str') v = unesc(raw);
          else if (t === 'b') v = raw === '1';
          else if (t === 'e') v = null;
          else { v = parseFloat(raw); if (dateStyle[s]) isDate = true; }
        }
        if (v === null || v === '') continue;
        let row = rows.get(r); if (!row) { row = []; rows.set(r, row); }
        row[c] = { v, d: isDate };
        if (r > maxRow) maxRow = r;
      }
      const merges = []; let m2; const rm = /<mergeCell ref="([A-Z$]+\d+):([A-Z$]+\d+)"/g;
      while ((m2 = rm.exec(xml))) { const a = splitRef(m2[1]), b = splitRef(m2[2]); if (a && b) merges.push({ c1: a[0], r1: a[1], c2: b[0], r2: b[1] }); }
      const rh = /<hyperlink\b([^>]*)\/?>/g;
      while ((m2 = rh.exec(xml))) {
        const ref = attr(m2[1], 'ref'); const rid = attr(m2[1], 'r:id'); const loc = attr(m2[1], 'location');
        let url = rid && rels[rid] ? rels[rid].target : null;
        if (!url && !loc) continue;
        if (url && loc) url += '#' + loc;
        const [from, to] = (ref || '').split(':');
        const a = splitRef(from), b = to ? splitRef(to) : a; if (!a) continue;
        for (let r = a[1]; r <= b[1]; r++) for (let c = a[0]; c <= b[0] && c < maxCol; c++) {
          const row = rows.get(r); if (row && row[c]) row[c].l = url || null;
        }
      }
      return { name: sh.name, rows, merges, maxRow };
    }
    let modified = null;
    const core = await z.text('docProps/core.xml');
    const mm = core && /<dcterms:modified[^>]*>([^<]+)</.exec(core);
    if (mm) { const t = Date.parse(mm[1]); if (!isNaN(t)) modified = t; }
    return { sheets, readSheet, modified };
  }

  /* ---------- Model ---------- */
  const norm = v => (v == null ? '' : String(v)).replace(/[\t\r\n]+/g, ' ').replace(/\s+/g, ' ').trim();
  const SUBKEYS = new Set(['site around', 'ส่ง', 'ตอบกลับ', 'สถานะ', 'วันที่ส่ง', 'วันที่ตอบกลับ', 'r1.', 'cc:', 'ล่วงเวลา', 'วันที่เอกสาร', 'วันที่รับในระบบ']);
  const SEND = new Set(['ส่ง', 'วันที่ส่ง', 'วันที่ส่งเข้าระบบ']);
  const REPLY = new Set(['ตอบกลับ', 'วันที่ตอบกลับ']);
  const isCodeLabel = s => /^(รหัส(\s*r\d\.?)?|site\s*around|sitearound)$/i.test(s);
  const isRevLabel = s => /^r\.?\s*\d+\.?$/i.test(s) || /^status$/i.test(s);

  const CATS = [
    [/^MAT-/i, 'MAT', 'Material Approval', true],
    [/^Shop/i, 'SHOP', 'Shop Drawing', true],
    [/^Ins-/i, 'INSP', 'Inspection', true],
    [/^MO-/i, 'MO', 'ตรวจรับวัสดุ (MO)', true],
    [/^RFI/i, 'RFI', 'RFI', true],
    [/^HO-/i, 'HO', 'ส่งมอบพื้นที่ (HO)', true],
    [/^DRP$/i, 'DRP', 'รายงานประจำวัน (DRP)', true],
    [/^DRQ$/i, 'DRQ', 'คำขอทำงาน (DRQ)', true],
    [/^RFA-GN/i, 'GN', 'เอกสารทั่วไป (GN)', true],
    [/^OT$/i, 'OT', 'ทำงานล่วงเวลา (OT)', true],
    [/^Med?thod|^Method/i, 'MS', 'Method Statement', true],
    [/^VO-/i, 'VO', 'งานเปลี่ยนแปลง (VO)', true],
    [/^VI$/i, 'VI', 'คำสั่งงาน (VI)', false],
    [/^(MEMO|Letter)/i, 'ML', 'Memo / Letter', false],
    [/^Doc\.? ?By/i, 'IN', 'เอกสารรับเข้า', false],
  ];
  function catOf(name) {
    for (const [re, id, label, track] of CATS) if (re.test(name)) return { id, label, track };
    return { id: 'OTHER', label: 'อื่น ๆ', track: true };
  }
  function discOf(name) {
    const m = /(?:^|[-_ ])(EE|AC|SN|FP|M&E)$/i.exec(name.trim());
    return m ? m[1].toUpperCase() : 'GEN';
  }

  function cellAt(sh, r, c) { const row = sh.rows.get(r); return row ? row[c] : undefined; }
  function headerText(sh, r, c) {
    const cell = cellAt(sh, r, c); if (cell) return norm(cell.v);
    for (const m of sh.merges) if (r >= m.r1 && r <= m.r2 && c >= m.c1 && c <= m.c2 && (m.r1 !== r || m.c1 !== c)) {
      if (m.r1 !== r) return ''; // vertical merge from above: belongs to top header
      const tl = cellAt(sh, m.r1, m.c1); return tl ? norm(tl.v) : '';
    }
    return '';
  }

  function classifyStatus(raw, hasReply, hasSend, track) {
    const s = raw.toUpperCase().replace(/\s+/g, ' ').trim();
    if (s) {
      if (/^(AP|APPROVED?|PASS|PASSED|ผ่าน|อนุมัติ)$/.test(s)) return 'ok';
      if (/^(AN|APPROVED AS NOTED)$/.test(s) || /^AN\b/.test(s)) return 'note';
      if (/^(NP|NOT ?PASS(ED)?|NOT ?APPROVED?|REJECT(ED)?|ไม่ผ่าน|ไม่อนุมัติ)$/.test(s) || /^NOT\b/.test(s)) return 'fail';
      if (/^ANS/.test(s)) return 'answered';
      return 'other';
    }
    if (hasReply) return 'answered';
    if (hasSend) return track ? 'waiting' : 'sent';
    return 'none';
  }

  function keyFallback(docNo, prefix) {
    const t0 = norm(docNo); if (!t0) return '';
    if (/^\d+(\.0+)?$/.test(t0)) return prefix ? prefix + parseInt(t0, 10) : '';
    const s = (t0.toUpperCase() + ' ').split(' ')[0];
    const toks = s.replace(/[\/_]/g, '-').split('-').filter(Boolean)
      .filter(t => t !== 'AIH' && t !== 'RIH' && !(t[0] === 'R' && t.length <= 3 && /^\d+$/.test(t.slice(1, 3))));
    const out = [];
    for (const t of toks) { const isN = /^\d+$/.test(t); out.push(isN ? String(parseInt(t, 10)) : t); if (isN) break; }
    return out.join('-');
  }

  function buildLinks(sh) {
    const map = new Map(); if (!sh) return map;
    let hr = 0, cols = {};
    for (let r = 1; r <= 5 && !hr; r++) {
      const row = sh.rows.get(r) || [];
      row.forEach((c, i) => { if (c && norm(c.v) === 'DocCode_NoProject') hr = r; });
      if (hr) row.forEach((c, i) => { if (c) cols[norm(c.v)] = i; });
    }
    if (!hr) return map;
    const g = (row, k) => (cols[k] != null && row[cols[k]] ? norm(row[cols[k]].v) : '');
    for (let r = hr + 1; r <= sh.maxRow; r++) {
      const row = sh.rows.get(r); if (!row) continue;
      const key = g(row, 'DocCode_NoProject'); const link = g(row, 'Link');
      if (!key || !/^https?:/i.test(link)) continue;
      const e = { rev: g(row, 'Rev').toUpperCase(), latest: g(row, 'Latest').toUpperCase() === 'Y', status: g(row, 'Status'), link, code: g(row, 'DocCode'), file: g(row, 'FileName') };
      const k = key.toUpperCase();
      if (!map.has(k)) map.set(k, []); map.get(k).push(e);
    }
    return map;
  }

  function parseDocSheet(sh, links) {
    // header row
    let hr = 0;
    for (let r = 1; r <= 6 && !hr; r++) { const row = sh.rows.get(r) || []; if (row.some(c => c && norm(c.v) === 'เลขที่เอกสาร')) hr = r; }
    if (!hr) return null;
    let width = 0; for (const r of [hr, hr + 1]) { const row = sh.rows.get(r) || []; width = Math.max(width, row.length); }
    for (const m of sh.merges) if (m.r1 === hr) width = Math.max(width, m.c2 + 1);
    const top = [], sub = [];
    for (let c = 0; c < width; c++) top[c] = headerText(sh, hr, c);
    let end = top.findIndex(t => t === 'หมายเหตุ');
    const keyCol = top.findIndex(t => t === 'รหัสค้นหา');
    if (end < 0) end = keyCol > 0 ? keyCol - 1 : width - 1;
    const subRow = (sh.rows.get(hr + 1) || []).slice(0, end + 1);
    const isSub = subRow.some(c => c && typeof c.v === 'string' && SUBKEYS.has(norm(c.v).toLowerCase())) && !subRow.some(c => c && c.d);
    const dataStart = isSub ? hr + 2 : hr + 1;
    for (let c = 0; c < width; c++) sub[c] = isSub ? headerText(sh, hr + 1, c) : '';

    const cols = { doc: -1, desc: -1, remark: -1, fields: [] };
    const revs = []; const codes = []; let cur = null;
    for (let c = 0; c <= end; c++) {
      const t = top[c], s = sub[c], tl = t.toLowerCase(), sl = s.toLowerCase();
      if (t === 'เลขที่เอกสาร' && cols.doc < 0) { cols.doc = c; continue; }
      if (/^รายละเอียด/.test(t) && cols.desc < 0) { cols.desc = c; continue; }
      if (t === 'หมายเหตุ') { cols.remark = c; continue; }
      if (/^(ลำดับ|no\.?\d*)$/i.test(t)) continue;
      const role = (x) => SEND.has(x) ? 'send' : REPLY.has(x) ? 'reply' : x === 'สถานะ' ? 'status' : isCodeLabel(x) ? 'code' : null;
      let ro = role(sl) || role(tl) || (role(s) || role(t));
      if (!ro && SEND.has(s)) ro = 'send';
      if (ro === 'code') { codes.push(c); continue; }
      if (ro === 'send') { cur = { send: c }; revs.push(cur); continue; }
      if (ro === 'reply') { if (!cur || cur.reply != null) { cur = {}; revs.push(cur); } cur.reply = c; continue; }
      if (ro === 'status') { if (!cur || cur.status != null) { cur = {}; revs.push(cur); } cur.status = c; continue; }
      let label = t && !isRevLabel(t) ? t : s;
      if (t && s && !isRevLabel(t) && s !== t) label = t + ' ' + s;
      cols.fields.push({ c, label: label || '' });
    }
    if (cols.desc < 0) { const i = cols.fields.findIndex(f => !f.label); if (i >= 0) { cols.desc = cols.fields[i].c; cols.fields.splice(i, 1); } }
    codes.forEach((c, k) => { while (revs.length <= k) revs.push({}); revs[k].code = c; });

    const cat = catOf(sh.name), disc = discOf(sh.name);
    // prefix for numeric doc numbers, learned from cached keys
    let prefix = '';
    if (keyCol >= 0) for (let r = dataStart; r <= sh.maxRow && !prefix; r++) {
      const k = cellAt(sh, r, keyCol), d = cols.doc >= 0 ? cellAt(sh, r, cols.doc) : null;
      if (k && d && typeof d.v === 'number') { const m = /^(.*-)\d+$/.exec(norm(k.v)); if (m) prefix = m[1]; }
    }
    const docs = [];
    const val = (r, c) => { if (c == null || c < 0) return null; const x = cellAt(sh, r, c); return x || null; };
    for (let r = dataStart; r <= sh.maxRow; r++) {
      const row = sh.rows.get(r); if (!row) continue;
      const dc = val(r, cols.doc), de = val(r, cols.desc);
      const docNo = dc ? (typeof dc.v === 'number' ? String(dc.v) : norm(dc.v)) : '';
      const desc = de ? norm(de.v) : '';
      const rv = revs.map((spec, i) => {
        const code = val(r, spec.code), sd = val(r, spec.send), rd = val(r, spec.reply), stc = val(r, spec.status);
        const asDate = x => x && typeof x.v === 'number' && x.v > 20000 && x.v < 80000 ? Math.round(x.v) : null;
        return {
          rev: 'R' + i,
          code: code ? norm(code.v) : '', sa: (code && code.l) || '',
          send: asDate(sd), reply: asDate(rd), status: stc && typeof stc.v === 'string' ? norm(stc.v) : '',
        };
      });
      const any = rv.some(x => x.code || x.send || x.reply || x.status);
      if (!desc && !any) continue;
      if (!desc && !docNo && !rv.some(x => x.code)) continue;
      const fields = [];
      for (const f of cols.fields) {
        const x = val(r, f.c); if (!x) continue;
        let v = x.d || (/วันที่/.test(f.label) && typeof x.v === 'number' && x.v > 20000) ? { date: Math.round(x.v) } : norm(x.v);
        if (v === '' ) continue;
        fields.push([f.label, v]);
      }
      const remark = cols.remark >= 0 && val(r, cols.remark) ? norm(val(r, cols.remark).v) : '';
      const kc = keyCol >= 0 ? val(r, keyCol) : null;
      let key = kc ? norm(kc.v) : '';
      if (!key) key = keyFallback(docNo, prefix);
      // OneDrive links
      const entries = key ? links.get(key.toUpperCase()) || [] : [];
      const latestE = entries.find(e => e.latest) || null;
      rv.forEach(x => { const e = entries.find(e => e.rev === x.rev); x.file = e ? e.link : ''; x.fileStatus = e ? e.status : ''; });
      let li = -1; rv.forEach((x, i) => { if (x.code || x.send || x.reply || x.status) li = i; });
      const L = li >= 0 ? rv[li] : { rev: 'R0' };
      const cls = classifyStatus(L.status || '', !!L.reply, !!(L.send || L.code), cat.track);
      const fullCode = latestE && latestE.code ? latestE.code : (entries[0] && entries[0].code) || '';
      docs.push({
        sheet: sh.name, row: r, cat: cat.id, disc, docNo, fullCode, key, desc, remark, fields,
        revs: rv.slice(0, Math.max(li + 1, 1)), li: Math.max(li, 0), cls,
        latestFile: latestE ? { link: latestE.link, rev: latestE.rev, status: latestE.status } : (entries.length ? { link: entries[entries.length - 1].link, rev: entries[entries.length - 1].rev, status: entries[entries.length - 1].status } : null),
      });
    }
    return { name: sh.name, cat: cat.id, catLabel: cat.label, track: cat.track, disc, docs, revCount: revs.length, cols: cols.fields.map(f => f.label) };
  }

  async function parse(buf, onProgress = () => {}) {
    const wb = await openWorkbook(buf);
    onProgress(0.05, 'อ่านโครงสร้างไฟล์');
    const linkSheetMeta = wb.sheets.find(s => s.name === 'Links');
    const links = linkSheetMeta ? buildLinks(await wb.readSheet(linkSheetMeta, 20)) : new Map();
    const SKIP = /^(สารบัญ|MAIN$|สรุป|Privote|Pivot|\d+$|คำสั่ง|ฐานคำนวณ|รายการวันที่|Links$|ตรวจไฟล์ขาด)/i;
    const out = []; const list = wb.sheets.filter(s => s.path && !SKIP.test(s.name.trim()));
    for (let i = 0; i < list.length; i++) {
      onProgress(0.1 + 0.88 * (i / list.length), 'ชีต ' + list[i].name);
      await new Promise(r => setTimeout(r, 0));
      const sh = await wb.readSheet(list[i], 64);
      if (!sh) continue;
      const p = parseDocSheet(sh, links);
      if (p && p.docs.length) out.push(p);
    }
    onProgress(1, 'เสร็จสิ้น');
    return { sheets: out, savedAt: wb.modified, linkCount: [...links.values()].reduce((a, b) => a + b.length, 0) };
  }
  return { parse, keyFallback, classifyStatus };
})();
if (typeof module !== 'undefined') module.exports = DCS;
</script>
<script>
/* ===== App ===== */
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const TH_M = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
  const toDate = s => new Date(Math.round((s - 25569) * 864e5));
  const fmtD = s => { if (s == null) return '–'; const d = toDate(s); return d.getUTCDate() + ' ' + TH_M[d.getUTCMonth()] + ' ' + String((d.getUTCFullYear() + 543) % 100).padStart(2, '0'); };
  const todaySerial = () => { const n = new Date(); return Math.floor((Date.UTC(n.getFullYear(), n.getMonth(), n.getDate())) / 864e5) + 25569; };
  const fmtStamp = t => { const d = new Date(t); return d.getDate() + ' ' + TH_M[d.getMonth()] + ' ' + ((d.getFullYear() + 543) % 100) + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') + ' น.'; };

  const STATUS = {
    ok: ['อนุมัติ / ผ่าน', 'var(--ok)'], note: ['อนุมัติตามหมายเหตุ (AN)', 'var(--note)'], fail: ['ไม่อนุมัติ / ไม่ผ่าน', 'var(--fail)'],
    waiting: ['รอตอบกลับ', 'var(--wait)'], answered: ['ตอบกลับแล้ว', 'var(--ans)'], sent: ['ส่งแล้ว', 'var(--idle)'],
    other: ['สถานะอื่น', 'var(--idle)'], none: ['ยังไม่ส่ง', '#B9C6CC'], in: ['รับเข้า', 'var(--idle)'],
  };
  const DISC = [['ALL', 'ทุกระบบ'], ['EE', 'EE'], ['AC', 'AC'], ['SN', 'SN'], ['FP', 'FP'], ['M&E', 'M&E'], ['GEN', 'ทั่วไป']];
  const CAT_ORDER = ['MAT', 'SHOP', 'INSP', 'MO', 'RFI', 'HO', 'DRP', 'DRQ', 'GN', 'OT', 'MS', 'VO', 'VI', 'ML', 'IN', 'OTHER'];

  const state = { data: null, meta: null, tab: 'docs', disc: 'ALL', q: '', docFilter: 'all', statusF: 'all', allRevs: true, limit: 120, bucket: 'all', check: null, sort: 'new' };
  let all = [], catInfo = {}, handle = null;

  /* ---------- storage (IndexedDB, best effort) ---------- */
  const idb = (() => {
    let dbp = null;
    const open = () => dbp || (dbp = new Promise((res, rej) => { try { const r = indexedDB.open('aih-dcs', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } }));
    const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction('kv', mode); const st = t.objectStore('kv'); const q = fn(st); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }); };
    return { get: k => tx('readonly', s => s.get(k)).catch(() => null), set: (k, v) => tx('readwrite', s => s.put(v, k)).catch(() => null) };
  })();
  const ls = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

  /* ---------- loading ---------- */
  const overlay = $('#overlay');
  function progress(p, t) { $('#ldFill').style.width = Math.round(p * 100) + '%'; $('#ldText').textContent = t; }
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 3200); }

  /* ---------- OneDrive link ---------- */
  const LINK_MODE = !!window.DCS_LINK_MODE;
  const DEFAULT_LINK = window.DCS_DEFAULT_LINK || '';
  const getLink = () => ls.get('dcs-link') ?? DEFAULT_LINK;
  function downloadUrl(link) {
    link = (link || '').trim(); if (!link) return '';
    let m = /^https?:\/\/1drv\.ms\/[a-z]\/c\/([0-9a-f]+)\/([A-Za-z0-9_-]+)/i.exec(link);
    if (m) return `https://my.microsoftpersonalcontent.com/personal/${m[1]}/_layouts/15/download.aspx?share=${m[2]}`;
    if (/download\.aspx|[?&]download=1/i.test(link)) return link;
    return link + (link.includes('?') ? '&' : '?') + 'download=1';
  }
  let fetching = false;
  async function loadFromLink(silent) {
    const url = downloadUrl(getLink());
    if (!url) { toast('ยังไม่ได้ใส่ลิงก์ OneDrive · กด “ตั้งค่าลิงก์” ก่อน'); return false; }
    if (fetching) return false; fetching = true;
    const showOverlay = !silent || !state.data;
    if (showOverlay) { overlay.hidden = false; $('#ldTitle').textContent = 'กำลังดึงไฟล์จาก OneDrive…'; progress(0.02, 'เชื่อมต่อ OneDrive'); }
    else setSync('กำลังดึงข้อมูลล่าสุดจาก OneDrive…');
    try {
      const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 90000);
      const r = await fetch(url + (url.includes('?') ? '&' : '?') + '_=' + Date.now(), { cache: 'no-store', signal: ctl.signal });
      if (r.status === 401 || r.status === 403 || r.status === 404) throw new Error('ลิงก์ใช้ไม่ได้ (รหัส ' + r.status + ') ลิงก์อาจถูกยกเลิกการแชร์ หรือไม่ได้ตั้งเป็น “ทุกคนที่มีลิงก์”');
      if (!r.ok) throw new Error('OneDrive ตอบกลับรหัส ' + r.status);
      const total = +r.headers.get('content-length') || 0;
      let buf;
      if (r.body && total) {
        const rd = r.body.getReader(); const parts = []; let got = 0;
        for (;;) { const { done, value } = await rd.read(); if (done) break; parts.push(value); got += value.length; if (showOverlay) progress(0.02 + 0.5 * got / total, 'ดาวน์โหลด ' + (got / 1048576).toFixed(1) + ' / ' + (total / 1048576).toFixed(1) + ' MB'); }
        const u8 = new Uint8Array(got); let o = 0; for (const p of parts) { u8.set(p, o); o += p.length; } buf = u8.buffer;
      } else buf = await r.arrayBuffer();
      clearTimeout(to);
      const head = new Uint8Array(buf, 0, 2);
      if (head[0] !== 0x50 || head[1] !== 0x4b) throw new Error('ลิงก์นี้ไม่ได้ส่งไฟล์ Excel กลับมา ตรวจว่าเป็นลิงก์แชร์ของไฟล์ .xlsx');
      const data = await DCS.parse(buf, showOverlay ? (p, t) => progress(0.52 + 0.48 * p, t) : () => {});
      if (!data.sheets.length) throw new Error('ไม่พบชีตทะเบียนเอกสารในไฟล์จากลิงก์นี้');
      const meta = { name: 'Document Control Status (RIH).xlsx', source: 'onedrive', modified: data.savedAt || Date.now(), readAt: Date.now(), size: buf.byteLength };
      setData(data, meta); idb.set('data', { data, meta });
      if (!silent) toast('ดึงข้อมูลล่าสุดจาก OneDrive แล้ว · ' + all.length.toLocaleString() + ' รายการ');
      return true;
    } catch (e) {
      console.error(e);
      const msg = e.name === 'AbortError' ? 'ดึงไฟล์นานเกินไป ลองกดอัปเดตอีกครั้ง' : /fetch|network/i.test(e.message) ? 'เชื่อมต่อ OneDrive ไม่ได้ ตรวจอินเทอร์เน็ต หรือกด “เปิดไฟล์ในเครื่อง” แทน' : e.message;
      toast(msg); if (state.data) setSync('ดึงจาก OneDrive ไม่สำเร็จ · แสดงข้อมูลรอบก่อน', true);
      return false;
    } finally { fetching = false; overlay.hidden = true; $('#ldTitle').textContent = 'กำลังอ่านไฟล์ Excel…'; }
  }
  function setSync(text, warn) { const el = $('#syncNote'); if (el) { el.textContent = text; el.className = 'sync' + (warn ? ' warn' : ''); el.hidden = !text; } }

  async function loadFile(file, fromHandle) {
    if (!/\.xls[xm]$/i.test(file.name)) { toast('กรุณาเลือกไฟล์ .xlsx (Document Control Status)'); return; }
    overlay.hidden = false; progress(0.02, 'เปิดไฟล์ ' + file.name);
    try {
      const buf = await file.arrayBuffer();
      const data = await DCS.parse(buf, progress);
      if (!data.sheets.length) throw new Error('ไม่พบชีตทะเบียนเอกสารในไฟล์นี้ ตรวจว่าเลือกไฟล์ Document Control Status ถูกไฟล์');
      const meta = { name: file.name, source: 'file', modified: file.lastModified, readAt: Date.now(), size: file.size, viaHandle: !!fromHandle };
      setData(data, meta);
      idb.set('data', { data, meta });
      toast('อัปเดตข้อมูลแล้ว · ' + all.length.toLocaleString() + ' รายการ จาก ' + data.sheets.length + ' ชีต');
    } catch (e) {
      console.error(e); toast('อ่านไฟล์ไม่สำเร็จ: ' + (e.message || e));
    } finally { overlay.hidden = true; }
  }

  async function pickFile() {
    if (window.showOpenFilePicker) {
      try {
        const [h] = await window.showOpenFilePicker({ types: [{ description: 'Excel', accept: { 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx', '.xlsm'] } }], multiple: false });
        handle = h; idb.set('handle', h);
        await loadFile(await h.getFile(), true); return;
      } catch (e) { if (e && e.name === 'AbortError') return; }
    }
    $('#fileInput').click();
  }
  async function refresh() {
    if (LINK_MODE && getLink()) { await loadFromLink(false); return; }
    if (handle) {
      try {
        let p = await handle.queryPermission({ mode: 'read' });
        if (p !== 'granted') p = await handle.requestPermission({ mode: 'read' });
        if (p === 'granted') { await loadFile(await handle.getFile(), true); return; }
      } catch (e) { console.warn(e); }
    }
    pickFile();
  }
  $('#btnPick').onclick = pickFile;
  $('#btnRefresh').onclick = refresh;
  $('#fileInput').onchange = e => { const f = e.target.files[0]; if (f) { handle = null; loadFile(f, false); } e.target.value = ''; };
  window.addEventListener('dragover', e => { e.preventDefault(); document.querySelector('.drop')?.classList.add('over'); });
  window.addEventListener('dragleave', e => { if (!e.relatedTarget) document.querySelector('.drop')?.classList.remove('over'); });
  window.addEventListener('drop', e => { e.preventDefault(); document.querySelector('.drop')?.classList.remove('over'); const f = e.dataTransfer.files[0]; if (f) { handle = null; loadFile(f, false); } });

  /* ---------- data prep ---------- */
  function setData(data, meta) {
    state.data = data; state.meta = meta; all = []; catInfo = {};
    const today = todaySerial();
    for (const s of data.sheets) {
      if (!catInfo[s.cat]) catInfo[s.cat] = { id: s.cat, label: s.catLabel, track: s.track, sheets: [] };
      catInfo[s.cat].sheets.push(s.name);
      for (const d of s.docs) {
        const L = d.revs[d.li] || {};
        d.track = s.track;
        if (s.cat === 'IN') d.cls = 'in';
        d.L = L;
        d.age = d.cls === 'waiting' && L.send ? today - L.send : null;
        d.label = /^\d+$/.test(d.docNo) ? (d.fullCode || d.key || '#' + d.docNo) : (d.docNo || d.fullCode || d.key);
        d.hay = [d.sheet, d.docNo, d.fullCode, d.key, d.desc, d.remark, ...d.fields.map(f => typeof f[1] === 'object' ? '' : f[1]), ...d.revs.map(r => r.code + ' ' + r.status)].join(' ').toLowerCase();
        d.flagFile = d.cls === 'waiting' && L.fileStatus ? L.fileStatus : '';
        d.future = d.revs.some(r => (r.send && r.send > today) || (r.reply && r.reply > today));
        d.noFile = d.track && ['ok', 'note', 'fail', 'answered'].includes(d.cls) && !L.file && !(d.latestFile && (d.latestFile.rev === L.rev || !d.latestFile.rev));
        all.push(d);
      }
    }
    render();
  }

  const inDisc = d => state.disc === 'ALL' || d.disc === state.disc;
  const tracked = () => all.filter(d => d.track && inDisc(d));

  /* ---------- render helpers ---------- */
  function pill(d) {
    const L = d.L; const raw = L.status || STATUS[d.cls][0];
    const text = d.cls === 'waiting' || d.cls === 'answered' || d.cls === 'sent' || d.cls === 'none' || d.cls === 'in' ? STATUS[d.cls][0] : raw;
    return `<span class="pill s-${d.cls}">${esc(d.revs.length > 1 || L.rev !== 'R0' ? L.rev + ' · ' : '')}${esc(text)}</span>`;
  }
  function ageBadge(a) { if (a == null) return ''; const c = a <= 7 ? 'a1' : a <= 14 ? 'a2' : a <= 30 ? 'a3' : 'a4'; return `<span class="age ${c}">รอ ${a} วัน</span>`; }
  function fieldText(f) { const v = typeof f[1] === 'object' ? fmtD(f[1].date) : f[1]; return f[0] ? `${esc(f[0])} <em>${esc(v)}</em>` : `<em>${esc(v)}</em>`; }
  function links(d) {
    const L = d.L; const out = [];
    const saRev = [...d.revs].reverse().find(r => r.sa);
    if (saRev) out.push(`<a class="lk sa" href="${esc(saRev.sa)}" target="_blank" rel="noopener"><span class="lk-ic">SA</span><span class="t">Site Around</span><small>${esc(saRev.code)}</small></a>`);
    else out.push(`<span class="lk sa off"><span class="lk-ic">SA</span><span class="t">ไม่มีลิงก์ Site Around</span></span>`);
    const f = d.latestFile;
    if (f) out.push(`<a class="lk od" href="${esc(f.link)}" target="_blank" rel="noopener"><span class="lk-ic">PDF</span><span class="t">OneDrive</span><small>${esc([f.rev, f.status].filter(Boolean).join(' ') || 'เปิดไฟล์')}</small></a>`);
    else out.push(`<span class="lk od off"><span class="lk-ic">PDF</span><span class="t">ยังไม่พบไฟล์</span></span>`);
    return out.join('');
  }
  function revTable(d) {
    const rows = d.revs.map(r => `<tr><td><b>${esc(r.rev)}</b></td><td>${r.sa ? `<a href="${esc(r.sa)}" target="_blank" rel="noopener" class="mono">${esc(r.code)}</a>` : `<span class="mono">${esc(r.code || '–')}</span>`}</td><td>${fmtD(r.send)}</td><td>${fmtD(r.reply)}</td><td>${r.status ? esc(r.status) : '–'}</td><td>${r.file ? `<a href="${esc(r.file)}" target="_blank" rel="noopener">เปิด PDF${r.fileStatus ? ' (' + esc(r.fileStatus) + ')' : ''}</a>` : '–'}</td></tr>`).join('');
    return `<div class="rev-tbl"><table><thead><tr><th>Rev</th><th>Site Around</th><th>ส่ง</th><th>ตอบกลับ</th><th>สถานะ</th><th>ไฟล์ OneDrive</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  function docRow(d) {
    const L = d.L;
    const meta = d.fields.map(fieldText);
    const dur = L.send && L.reply && L.reply >= L.send ? ` <span class="num">(${L.reply - L.send} วัน)</span>` : '';
    const dates = d.cat === 'IN' ? '' : `<div class="dates"><span>ส่ง <b class="num">${fmtD(L.send)}</b></span><span>ตอบกลับ <b class="num">${fmtD(L.reply)}</b>${dur}</span></div>`;
    const flag = d.flagFile ? `<span class="remark">ไฟล์ตอบกลับ ${esc(d.flagFile)} อยู่ใน OneDrive แล้ว แต่ Excel ยังไม่ลงผล</span>` : '';
    return `<article class="doc s-${d.cls}">
      <div class="doc-main">
        <div class="doc-top"><span class="tag">${esc(d.sheet)}</span><span class="code">${esc(d.label)}</span></div>
        <p class="desc">${esc(d.desc || '(ไม่มีรายละเอียด)')}</p>
        ${meta.length ? `<div class="meta">${meta.join('')}</div>` : ''}
        ${d.remark ? `<span class="remark">หมายเหตุ: ${esc(d.remark)}</span>` : ''}${flag}
      </div>
      <div class="doc-state">${pill(d)}${ageBadge(d.age)}${dates}</div>
      <div class="doc-links">${links(d)}</div>
      ${d.revs.length > 1 || state.allRevs ? `<details class="revs"${state.allRevs ? ' open' : ''}><summary>ประวัติทุก Rev (${d.revs.length})</summary>${revTable(d)}</details>` : ''}
    </article>`;
  }
  function listBlock(items, emptyMsg) {
    if (!items.length) return `<div class="empty-list">${emptyMsg}</div>`;
    const shown = items.slice(0, state.limit);
    return `<div class="docs">${shown.map(docRow).join('')}</div>` + (items.length > shown.length ? `<button class="btn more" type="button" data-more>แสดงเพิ่มอีก ${Math.min(120, items.length - shown.length)} รายการ (เหลือ ${items.length - shown.length})</button>` : '');
  }

  /* ---------- views ---------- */
  function discRow() {
    const chips = DISC.filter(([id]) => id === 'ALL' || all.some(d => d.disc === id)).map(([id, l]) => `<button class="chip disc" type="button" data-disc="${esc(id)}" aria-pressed="${state.disc === id}">${l}</button>`).join('');
    return `<div class="disc-row" role="group" aria-label="กรองตามระบบ"><span class="row-lbl">ระบบ</span><div class="chips">${chips}</div></div>`;
  }
  function vOverview() {

      ${k('อนุมัติ / ผ่าน', c('ok'), pct(c('ok')), 'var(--ok)', 'docs:ok')}
      ${k('อนุมัติตามหมายเหตุ', c('note'), pct(c('note')), 'var(--note)', 'docs:note')}

      ${k('รอตอบกลับ', wait.length, old ? `เกิน 30 วัน ${old} รายการ` : 'ไม่มีรายการเกิน 30 วัน', 'var(--wait)', 'pending')}
    </section>`;
    // category breakdown
    const segs = ['ok', 'note', 'fail', 'answered', 'waiting', 'sent', 'in', 'other', 'none'];
    const rows = CAT_ORDER.filter(id => catInfo[id]).map(id => {
      const items = all.filter(d => d.cat === id && inDisc(d)); if (!items.length) return '';
      const cnt = {}; items.forEach(d => cnt[d.cls] = (cnt[d.cls] || 0) + 1);
      const bar = segs.filter(s => cnt[s]).map(s => `<span style="width:${cnt[s] * 100 / items.length}%;background:${STATUS[s][1]}" title="${STATUS[s][0]} ${cnt[s]}"></span>`).join('');
      const mini = segs.filter(s => cnt[s]).map(s => `<span><b style="color:${STATUS[s][1]}">●</b> ${STATUS[s][0].replace(/ \(AN\)/, '')} ${cnt[s]}</span>`).join('');
      return `<button class="cat" type="button" data-cat="${id}"><span class="nm">${esc(catInfo[id].label)}<small>${catInfo[id].sheets.filter(n => state.disc === 'ALL' || all.some(d => d.sheet === n && inDisc(d))).join(' · ')}</small></span><span class="barwrap"><span class="stack">${bar}</span><span class="mini">${mini}</span></span><span class="tot">${items.length}</span></button>`;
    }).join('');

    html += `<section class="panel"><div class="panel-h"><h2>สถานะตามประเภทเอกสาร <small>คลิกแถวเพื่อดูรายการ</small></h2><div class="legend">${legend}</div></div><div class="cats">${rows}</div></section>`;

    // activity + checks
    const today = todaySerial(); const recent = [];
    all.filter(inDisc).forEach(d => d.revs.forEach(r => { if (r.reply && today - r.reply <= 7 && r.reply <= today) recent.push({ d, r, t: r.reply, kind: 'ตอบกลับ' }); else if (r.send && today - r.send <= 7 && r.send <= today) recent.push({ d, r, t: r.send, kind: 'ส่ง' }); }));
    recent.sort((a, b) => b.t - a.t);
    const sentN = recent.filter(x => x.kind === 'ส่ง').length, repN = recent.length - sentN;
    const act = recent.slice(0, 10).map(x => `<li><span class="pill s-${x.kind === 'ส่ง' ? 'waiting' : (x.r.status ? DCS.classifyStatus(x.r.status, true, true, true) : 'answered')}">${x.kind}${x.r.status ? ' ' + esc(x.r.status) : ''}</span><span class="t" title="${esc(x.d.desc)}"><span class="mono">${esc(x.d.sheet)}</span> · ${esc(x.d.desc)}</span><span class="num" style="color:var(--muted);font-size:12.5px">${fmtD(x.t)}</span></li>`).join('');
    const flag = all.filter(d => d.flagFile && inDisc(d)).length, nof = all.filter(d => d.noFile && inDisc(d)).length;
    const fut = all.filter(d => d.future && inDisc(d)).length;
    const noSA = all.filter(d => d.track && inDisc(d) && d.cls !== 'none' && !d.revs.some(r => r.sa) && d.revs.some(r => r.code)).length;
    const chk = (key, n, title, sub, color, bg) => `<button class="check" type="button" data-check="${key}"><span class="ico" style="background:${bg};color:${color}">${n ? '!' : '✓'}</span><span><strong>${title}</strong><p>${sub}</p></span><b class="num" style="color:${n ? color : 'var(--ok)'}">${n}</b></button>`;
    html += `<div class="two">
      <section class="panel"><div class="panel-h"><h2>ความเคลื่อนไหว 7 วันล่าสุด</h2><small class="result-info">ส่ง ${sentN} · ตอบกลับ ${repN}</small></div>${act ? `<ul class="list-plain">${act}</ul>` : '<p class="result-info" style="padding:0 18px 16px">ยังไม่มีรายการส่งหรือตอบกลับในสัปดาห์นี้</p>'}</section>
      <section class="panel"><div class="panel-h"><h2>ตรวจความครบถ้วนของข้อมูล</h2></div>
        ${chk('flag', flag, 'มีไฟล์ตอบกลับแล้ว แต่ Excel ยังไม่ลงผล', 'OneDrive มีไฟล์ Rev นี้พร้อมสถานะ แต่ช่องวันที่ตอบกลับ/สถานะใน Excel ยังว่าง', 'var(--note)', 'var(--note-bg)')}
        ${chk('nofile', nof, 'ตอบกลับแล้ว แต่ยังไม่พบไฟล์ใน OneDrive', 'Rev ล่าสุดมีผลตอบกลับใน Excel แต่ตาราง Links ยังไม่มีไฟล์ของ Rev นี้', 'var(--wait)', 'var(--wait-bg)')}
        ${chk('future', fut, 'วันที่ส่ง/ตอบกลับเป็นวันในอนาคต', 'น่าจะพิมพ์วันที่ผิด เช่น เดือนหรือปีสลับกัน', 'var(--fail)', 'var(--fail-bg)')}
        ${chk('nosa', noSA, 'มีรหัส Site Around แต่ไม่มีลิงก์', 'ช่องรหัสยังไม่ได้ใส่ Hyperlink ไปยังหน้าเอกสารใน Site Around', 'var(--idle)', 'var(--idle-bg)')}
      </section></div>`;
    return html;
  }

  function vPending() {
    const W = tracked().filter(d => d.cls === 'waiting').sort((a, b) => (b.age ?? -1) - (a.age ?? -1));
    const B = [['all', 'ทั้งหมด', () => true], ['a1', 'ไม่เกิน 7 วัน', d => d.age != null && d.age <= 7], ['a2', '8–14 วัน', d => d.age > 7 && d.age <= 14], ['a3', '15–30 วัน', d => d.age > 14 && d.age <= 30], ['a4', 'เกิน 30 วัน', d => d.age > 30]];
    const bk = B.slice(1).map(([id, lbl, f]) => `<button class="bucket" type="button" data-bucket="${id}" aria-pressed="${state.bucket === id}"><span class="lbl">${lbl}</span><span class="val">${W.filter(f).length}</span></button>`).join('');
    const f = (B.find(b => b[0] === state.bucket) || B[0])[2];
    const items = W.filter(f).filter(matchQ);
    return discRow() + `<section class="buckets">${bk}</section>
      <div class="toolbar"><h2>เอกสารรอตอบกลับ <small>${items.length} รายการ · เรียงจากรอนานที่สุด${state.bucket !== 'all' ? ' · <a href="#pending" data-bucket="all">ดูทั้งหมด</a>' : ''}</small></h2></div>
      ${listBlock(items, 'ไม่มีเอกสารที่รอตอบกลับในตัวกรองนี้')}`;
  }
  function vResubmit() {
    const items = tracked().filter(d => d.cls === 'fail').filter(matchQ).sort((a, b) => (b.L.reply || 0) - (a.L.reply || 0));
    return discRow() + `<div class="toolbar"><h2>ต้องแก้ไขและส่ง Rev ใหม่ <small>${items.length} รายการ · Rev ล่าสุดเป็น NP / Not Pass และยังไม่มี Rev ถัดไป</small></h2></div>${listBlock(items, 'ไม่มีเอกสารที่ต้องแก้ไขส่งใหม่ 🎉'.replace(' 🎉', ''))}`;
  }
  function matchQ(d) {
    if (!state.q) return true;
    return state.q.toLowerCase().split(/\s+/).filter(Boolean).every(t => d.hay.includes(t));
  }
  function vDocs() {
    const f = state.docFilter;
    let items = all.filter(inDisc);
    if (f.startsWith('cat:')) items = items.filter(d => d.cat === f.slice(4));
    else if (f.startsWith('sheet:')) items = items.filter(d => d.sheet === f.slice(6));
    if (state.check === 'flag') items = items.filter(d => d.flagFile);
    if (state.check === 'nofile') items = items.filter(d => d.noFile);
    if (state.check === 'future') items = items.filter(d => d.future);
    if (state.check === 'nosa') items = items.filter(d => d.track && d.cls !== 'none' && !d.revs.some(r => r.sa) && d.revs.some(r => r.code));
    if (state.statusF !== 'all') items = items.filter(d => state.statusF === 'other' ? ['sent', 'other', 'none', 'in'].includes(d.cls) : d.cls === state.statusF);
    items = items.filter(matchQ);
    const sortMode = state.sort !== 'sheet' ? state.sort : state.q ? 'new' : 'sheet';
    if (sortMode !== 'sheet') {
      const today = todaySerial(); const ok = s => (s && s <= today ? s : 0);
      const dt = d => ok(d.L.send) || ok(d.L.reply) || ok((d.fields.find(f => f[1] && typeof f[1] === 'object') || [])[1]?.date) || 0;
      items = items.map((d, i) => [d, dt(d), i]).sort((x, y) => {
        if (!x[1] !== !y[1]) return x[1] ? -1 : 1; // no date goes last
        return (sortMode === 'new' ? y[1] - x[1] : x[1] - y[1]) || x[2] - y[2];
      }).map(x => x[0]);
    }
    const opts = [`<option value="all">ทุกประเภทเอกสาร</option>`].concat(CAT_ORDER.filter(id => catInfo[id]).map(id => `<optgroup label="${esc(catInfo[id].label)}"><option value="cat:${id}">${esc(catInfo[id].label)} — ทุกชีต</option>${catInfo[id].sheets.map(s => `<option value="sheet:${esc(s)}">ชีต ${esc(s)}</option>`).join('')}</optgroup>`)).join('');
    const sts = [['all', 'ทุกสถานะ'], ['ok', 'อนุมัติ/ผ่าน'], ['note', 'AN'], ['fail', 'ไม่อนุมัติ'], ['waiting', 'รอตอบกลับ'], ['answered', 'ตอบกลับแล้ว'], ['other', 'อื่น ๆ']];
    const checkNames = { flag: 'มีไฟล์ตอบกลับแล้ว แต่ Excel ยังไม่ลงผล', nofile: 'ตอบกลับแล้ว แต่ยังไม่พบไฟล์ใน OneDrive', nosa: 'มีรหัส Site Around แต่ไม่มีลิงก์', future: 'วันที่ส่ง/ตอบกลับเป็นวันในอนาคต' };
    const curLabel = f === 'all' ? 'ทุกประเภทเอกสาร' : f.startsWith('cat:') ? catInfo[f.slice(4)]?.label : 'ชีต ' + f.slice(6);
    const quick = [['all', 'ทั้งหมด']].concat(CAT_ORDER.filter(id => catInfo[id] && all.some(d => d.cat === id && inDisc(d))).map(id => ['cat:' + id, catInfo[id].label]));
    const curCat = f.startsWith('sheet:') ? 'cat:' + (all.find(d => d.sheet === f.slice(6))?.cat || '') : f;
    return `<section class="picker">
        <div class="picker-row">
          <label class="picker-lbl" for="docFilter"><span class="picker-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h10M4 18h6"/></svg></span><span><b>ประเภทเอกสาร</b><small>เลือกประเภท หรือเจาะลงทีละชีต</small></span></label>
          <div class="select-wrap"><select id="docFilter" aria-label="เลือกประเภทหรือชีต">${opts}</select></div>
          <div class="picker-count"><b class="num">${items.length.toLocaleString()}</b><span>รายการ</span></div>
        </div>
        <div class="quick" aria-label="เลือกประเภทด่วน">${quick.map(([v, l]) => `<button class="qchip" type="button" data-pickcat="${esc(v)}" aria-pressed="${curCat === v}">${esc(l)}</button>`).join('')}</div>
      </section>
      ${discRow()}
      <div class="toolbar">
        <div class="chips" id="statusChips">${sts.map(([v, l]) => `<button class="chip" type="button" data-status="${v}" aria-pressed="${state.statusF === v}">${l}</button>`).join('')}</div>
        <label class="toggle"><input type="checkbox" id="allRevs" ${state.allRevs ? 'checked' : ''}> แสดงประวัติทุก Rev</label>
        <span class="sort-group" role="group" aria-label="เรียงลำดับ">
          <label class="toggle sort-opt"><input type="checkbox" id="sortNew" ${state.sort === 'new' ? 'checked' : ''}> ล่าสุดก่อน</label>
          <label class="toggle sort-opt"><input type="checkbox" id="sortOld" ${state.sort === 'old' ? 'checked' : ''}> เก่าสุดก่อน</label>
        </span>
      </div>
      ${state.check ? `<div class="notice"><span>ตัวกรองตรวจข้อมูล: <b>${checkNames[state.check]}</b></span><button type="button" data-clearcheck>ล้างตัวกรอง</button></div>` : ''}
      ${state.q ? `<div class="notice"><span>ผลการค้นหา “<b>${esc(state.q)}</b>” จากทุกชีต</span><button type="button" data-clearq>ล้างคำค้น</button></div>` : ''}
      <div class="result-info">${esc(curLabel)} · ${items.length.toLocaleString()} รายการ${sortMode === 'new' ? ' · เรียงจากวันที่ส่งล่าสุด' : sortMode === 'old' ? ' · เรียงจากวันที่ส่งเก่าสุด' : ' · เรียงตามลำดับในชีต'}</div>
      ${listBlock(items, 'ไม่พบเอกสารตามเงื่อนไขนี้')}`;
  }

  function vStart() {
    return `<section class="start">
      <div class="drop">
        <h2>เปิดทะเบียนเอกสารจากไฟล์ Excel</h2>
        <p>เลือกไฟล์ <b>Document Control Status (RIH).xlsx</b> จากโฟลเดอร์ S_19 Document Status หรือลากไฟล์มาวางที่นี่ ระบบอ่านไฟล์ในเครื่องนี้เท่านั้น ไม่มีการอัปโหลดข้อมูลไปที่อื่น</p>
        ${LINK_MODE ? `<div class="start-actions"><button class="btn primary" type="button" data-fetchlink>ดึงข้อมูลจาก OneDrive</button><button class="btn" type="button" data-pick>เปิดไฟล์ในเครื่อง</button><button class="linkbtn" type="button" data-linkcfg>ตั้งค่าลิงก์ OneDrive</button></div>` : '<button class="btn primary" type="button" data-pick>เลือกไฟล์ Excel</button>'}
      </div>
      <ol class="steps">
        <li><span><b>แก้ข้อมูลใน Excel ตามปกติ</b><span>Excel ยังเป็นต้นฉบับหลัก หน้านี้อ่านอย่างเดียว</span></span></li>
        <li><span><b>บันทึกไฟล์ (Ctrl+S)</b><span>สูตรลิงก์ OneDrive และรหัสค้นหาจะคำนวณค่าล่าสุดตอนบันทึก</span></span></li>
        <li><span><b>กด “อัปเดตข้อมูล”</b><span>บน Chrome/Edge ในคอมพิวเตอร์ ระบบจำไฟล์เดิมไว้ กดปุ่มเดียวก็ได้ข้อมูลใหม่ บนมือถือให้เลือกไฟล์จากแอป OneDrive</span></span></li>
      </ol>
    </section>`;
  }

  function render() {
    const has = !!state.data;
    $('#bar').hidden = !has; $('#searchBox').hidden = !has; $('#btnRefresh').hidden = !has;
    if (has) {
      const m = state.meta; const stale = Date.now() - m.readAt > 864e5;
      $('#fileMeta').innerHTML = `<span class="dot${stale ? ' stale' : ''}"></span><span>${m.source === 'onedrive' ? 'ดึงจาก <b>OneDrive</b>' : 'ไฟล์ในเครื่อง <b>' + esc(m.name) + '</b>'}</span><span>Excel บันทึกล่าสุด <b>${fmtStamp(m.modified)}</b></span><span>อ่านข้อมูลเมื่อ <b>${fmtStamp(m.readAt)}</b></span><span>${all.length.toLocaleString()} รายการ · ${state.data.sheets.length} ชีต · ลิงก์ OneDrive ${state.data.linkCount.toLocaleString()} ไฟล์</span>${LINK_MODE ? '<button type="button" class="linkbtn" data-linkcfg>ตั้งค่าลิงก์ OneDrive</button>' : ''}<span id="syncNote" class="sync" hidden></span>`;
      const T = tracked();
      $('#cPending').textContent = T.filter(d => d.cls === 'waiting').length;
      $('#cResubmit').textContent = T.filter(d => d.cls === 'fail').length;
      document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === state.tab));
    }
    const v = !has ? vStart() : state.tab === 'pending' ? vPending() : state.tab === 'resubmit' ? vResubmit() : state.tab === 'docs' ? vDocs() : vOverview();
    $('#view').innerHTML = v;
    const sel = $('#docFilter'); if (sel) sel.value = state.docFilter;
    $('#foot').textContent = has ? 'ข้อมูลอ่านจากไฟล์ Excel โดยตรง · สถานะนับจาก Rev ล่าสุดที่มีข้อมูลของแต่ละเรื่อง · ลิงก์ OneDrive มาจากชีต Links' : '';
  }

  /* ---------- events ---------- */
  function go(tab, opts = {}) {
    Object.assign(state, { limit: 120 }, opts); state.tab = tab;
    if (location.hash !== '#' + tab) history.replaceState(null, '', '#' + tab);
    render(); window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
  }
  document.addEventListener('click', e => {
    const t = e.target.closest('button,a'); if (!t) return;
    if (t.dataset.tab) return go(t.dataset.tab);
    if (t.hasAttribute('data-pick')) return pickFile();
    if (t.hasAttribute('data-fetchlink')) return loadFromLink(false);
    if (t.hasAttribute('data-linkcfg')) return openLinkCfg();
    if (t.hasAttribute('data-linksave')) { const v = $('#linkInput').value.trim(); ls.set('dcs-link', v); $('#linkCfg').hidden = true; if (v) loadFromLink(false); else toast('ลบลิงก์แล้ว · ใช้การเปิดไฟล์ในเครื่องแทน'); return; }
    if (t.hasAttribute('data-linkreset')) { $('#linkInput').value = DEFAULT_LINK || ls.get('dcs-link') || ''; return; }
    if (t.hasAttribute('data-linkclose')) { $('#linkCfg').hidden = true; return; }
    if (t.hasAttribute('data-linkshare')) {
      const v = $('#linkInput').value.trim(); if (!v) { toast('ใส่ลิงก์ OneDrive ก่อน'); return; }
      const url = location.origin + location.pathname + '#src=' + encodeURIComponent(v);
      const done = () => toast('คัดลอกลิงก์สำหรับมือถือแล้ว · ส่งเข้า LINE ตัวเองแล้วเปิดบนมือถือครั้งเดียว');
      const fallback = () => { const i = $('#linkInput'); i.value = url; i.focus(); i.select(); toast('เลือกข้อความไว้แล้ว กด Ctrl+C เพื่อคัดลอก'); };
      try { navigator.clipboard.writeText(url).then(done, fallback); } catch { fallback(); }
      return;
    }
    if (t.dataset.disc) { state.disc = t.dataset.disc; state.limit = 120; ls.set('dcs-disc', state.disc); return render(); }
    if (t.dataset.go) { const [tab, st] = t.dataset.go.split(':'); return go(tab, tab === 'docs' ? { statusF: st || 'all', docFilter: 'all', check: null } : {}); }
    if (t.dataset.cat) return go('docs', { docFilter: 'cat:' + t.dataset.cat, statusF: 'all', check: null });
    if (t.dataset.check) return go('docs', { check: t.dataset.check, docFilter: 'all', statusF: 'all' });
    if (t.dataset.pickcat) { state.docFilter = t.dataset.pickcat; state.limit = 120; return render(); }
    if (t.dataset.status) { state.statusF = t.dataset.status; state.limit = 120; return render(); }
    if (t.dataset.bucket) { e.preventDefault(); state.bucket = t.dataset.bucket; state.limit = 120; return render(); }
    if (t.hasAttribute('data-more')) { state.limit += 120; return render(); }
    if (t.hasAttribute('data-clearcheck')) { state.check = null; return render(); }
    if (t.hasAttribute('data-clearq')) { state.q = ''; $('#q').value = ''; return render(); }
  });
  document.addEventListener('change', e => {
    if (e.target.id === 'docFilter') { state.docFilter = e.target.value; state.limit = 120; render(); }
    if (e.target.id === 'allRevs') { state.allRevs = e.target.checked; render(); }
    if (e.target.id === 'sortNew' || e.target.id === 'sortOld') {
      const mode = e.target.id === 'sortNew' ? 'new' : 'old';
      state.sort = e.target.checked ? mode : 'sheet'; state.limit = 120; ls.set('dcs-sort', state.sort); render();
    }
  });
  let qt; $('#q').addEventListener('input', e => {
    clearTimeout(qt); qt = setTimeout(() => {
      const was = state.q; state.q = e.target.value.trim(); state.limit = 120;
      if (state.q && !was) { state.docFilter = 'all'; state.check = null; }
      if (state.q && state.tab === 'overview') { state.tab = 'docs'; state.docFilter = 'all'; state.statusF = 'all'; state.check = null; history.replaceState(null, '', '#docs'); }
      render();
      const q = $('#q'); if (document.activeElement !== q) q.focus();
    }, 180);
  });
  window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (['overview', 'pending', 'resubmit', 'docs'].includes(h) && h !== state.tab) go(h); });

  function openLinkCfg() {
    const box = $('#linkCfg');
    box.querySelectorAll('[data-webonly]').forEach(b => b.hidden = location.protocol !== 'https:');
    box.querySelector('[data-linkreset]').hidden = !DEFAULT_LINK; $('#linkInput').value = getLink(); box.hidden = false; $('#linkInput').focus(); $('#linkInput').select();
  }

  /* ---------- boot ---------- */
  (async () => {
    const hm = /[#&]src=([^&]+)/.exec(location.hash);
    if (hm) { try { const v = decodeURIComponent(hm[1]); if (/^https:\/\//.test(v)) ls.set('dcs-link', v); } catch {} }
    state.tab = 'docs'; history.replaceState(null, '', '#docs');
    const d = ls.get('dcs-disc'); if (d) state.disc = d;
    render();
    const saved = await idb.get('data');
    if (saved && saved.data) setData(saved.data, saved.meta);
    if (LINK_MODE) {
      $('#btnRefresh').title = 'ดึงไฟล์ล่าสุดจากลิงก์ OneDrive';
      $('#btnPick').lastChild.textContent = 'เปิดไฟล์ในเครื่อง';
      if (getLink()) { await loadFromLink(true); return; }
      if (!state.data) { openLinkCfg(); return; }
    }
    try {
      const hd = await idb.get('handle');
      if (hd && hd.getFile) {
        handle = hd;
        if ((await hd.queryPermission({ mode: 'read' })) === 'granted') {
          const f = await hd.getFile();
          if (!saved || f.lastModified !== saved.meta.modified) await loadFile(f, true);
        }
      }
    } catch (e) { /* permission or storage not available */ }
  })();
})();
</script>
</body></html>
